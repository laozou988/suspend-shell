name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不再使用 setup-android（v3 在新 cmdline-tools 上装已废弃的 tools 包会失败），
      # 直接使用 runner 预装 Android SDK + 已接受 license，Gradle 自动补齐 compileSdk。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: suspend-shell-apk
          path: app/build/outputs/apk/debug/*.apk
